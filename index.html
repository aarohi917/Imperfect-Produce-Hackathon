<!doctype html>
<html>
<body style="margin:0;background:#111;color:#fff;font-family:sans-serif">
<div style="position:relative;display:inline-block">
  <video id="v" autoplay muted playsinline style="max-width:100vw"></video>
  <canvas id="c" style="position:absolute;left:0;top:0;width:100%;height:100%"></canvas>
</div>
<pre id="log">Loading model...</pre>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.webgpu.min.js"></script>
<script>
const MODEL = "yolov8s-worldv2.onnx";
const NAMES = ["apple","banana","orange","lemon","lime","grapefruit","pear","peach","plum","apricot","cherry","strawberry","blueberry","raspberry","grape","watermelon","cantaloupe","pineapple","mango","papaya","kiwi","pomegranate","avocado","coconut","fig","tomato","potato","sweet potato","onion","garlic","carrot","beet","radish","turnip","cucumber","zucchini","squash","pumpkin","eggplant","bell pepper","chili pepper","broccoli","cauliflower","cabbage","lettuce","spinach","kale","celery","asparagus","corn","green beans","peas","mushroom","ginger","leek","brussels sprouts","artichoke","okra"];
const CONF = 0.1, IOU_T = 0.5, SIZE = 640;
const v = document.getElementById("v"), c = document.getElementById("c"), log = document.getElementById("log");
const off = document.createElement("canvas"); off.width = off.height = SIZE;

const iou = (a, b) => {
  const x1 = Math.max(a[0], b[0]), y1 = Math.max(a[1], b[1]);
  const x2 = Math.min(a[0]+a[2], b[0]+b[2]), y2 = Math.min(a[1]+a[3], b[1]+b[3]);
  const i = Math.max(0, x2-x1) * Math.max(0, y2-y1);
  return i / (a[2]*a[3] + b[2]*b[3] - i || 1);
};

async function main() {
  v.srcObject = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } });
  await v.play();
  const session = await ort.InferenceSession.create(MODEL, { executionProviders: ["webgpu", "wasm"] });
  log.textContent = "Model loaded. Output dims will show here.";
  let first = true;

  async function frame() {
    const t0 = performance.now();
    const vw = v.videoWidth, vh = v.videoHeight;
    const s = Math.min(SIZE/vw, SIZE/vh), nw = Math.round(vw*s), nh = Math.round(vh*s);
    const dx = (SIZE-nw)/2, dy = (SIZE-nh)/2;
    const ctx = off.getContext("2d", { willReadFrequently: true });
    ctx.fillStyle = "#727272"; ctx.fillRect(0, 0, SIZE, SIZE);
    ctx.drawImage(v, dx, dy, nw, nh);
    const px = ctx.getImageData(0, 0, SIZE, SIZE).data, A = SIZE*SIZE;
    const inp = new Float32Array(3*A);
    for (let i = 0; i < A; i++) { inp[i] = px[i*4]/255; inp[A+i] = px[i*4+1]/255; inp[2*A+i] = px[i*4+2]/255; }
    const out = await session.run({ [session.inputNames[0]]: new ort.Tensor("float32", inp, [1,3,SIZE,SIZE]) });
    const t = out[session.outputNames[0]], d = t.data, n = t.dims[2], nc = t.dims[1] - 4;
    if (first) { log.textContent = "Output dims: " + t.dims.join("x") + " (classes: " + nc + ", names given: " + NAMES.length + ")"; first = false; }

    let cands = [];
    for (let i = 0; i < n; i++) {
      let best = 0, id = -1;
      for (let k = 0; k < nc; k++) { const sc = d[(4+k)*n + i]; if (sc > best) { best = sc; id = k; } }
      if (best < CONF) continue;
      const cx = d[i], cy = d[n+i], w = d[2*n+i], h = d[3*n+i];
      cands.push({ name: NAMES[id] ?? ("class " + id), score: best, box: [(cx-w/2-dx)/s, (cy-h/2-dy)/s, w/s, h/s] });
    }
    cands.sort((a, b) => b.score - a.score);
    const keep = [];
    for (const k of cands) if (!keep.some(q => q.name === k.name && iou(q.box, k.box) > IOU_T)) keep.push(k);

    c.width = vw; c.height = vh;
    const g = c.getContext("2d"); g.lineWidth = 3; g.font = "bold 18px sans-serif";
    keep.forEach((k, i) => {
      const [x, y, w, h] = k.box;
      g.strokeStyle = "#22c55e"; g.strokeRect(x, y, w, h);
      const label = `#${i+1} ${k.name} ${Math.round(k.score*100)}%`;
      g.fillStyle = "#22c55e"; g.fillRect(x, Math.max(0, y-24), g.measureText(label).width+10, 24);
      g.fillStyle = "#000"; g.fillText(label, x+5, Math.max(18, y-6));
    });
    log.textContent = log.textContent.split("\n")[0] + `\nItems: ${keep.length} | ${Math.round(performance.now()-t0)} ms/frame`;
    requestAnimationFrame(frame);
  }
  frame();
}
main().catch(e => { log.textContent = "ERROR: " + e.message; console.error(e); });
</script>
</body>
</html>
